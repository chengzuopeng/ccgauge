# Build and deploy the marketing site (under `site/`) to GitHub Pages.
#
# Triggers:
#   - any push to `main` that touches `site/**`, the workflow itself,
#     `package.json`, or `pnpm-lock.yaml`
#   - manual dispatch from the Actions tab
#
# Output: served at https://ccgauge.linkdiary.cn/ once
#         Settings → Pages → Source is set to "GitHub Actions" and
#         Settings → Pages → Custom domain matches `site/public/CNAME`.
#
# The domain is bound by `site/public/CNAME`, which Astro copies to the
# artifact root. Dropping the custom domain means going back to project
# Pages at /<repo>: delete that file and pass BASE_URL=/<repo> here.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Required for the Pages deployment + the OIDC token used by
# `actions/deploy-pages`.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run two Pages deployments at once — but never cancel an
# already-running one mid-deploy (Pages doesn't roll back gracefully).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No `version:` here — pnpm/action-setup reads `package.json`'s
        # `packageManager` field instead, so CI runs the exact same
        # pnpm version pinned at commit time. Specifying both raises
        # ERR_PNPM_BAD_PM_VERSION.
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        # `--frozen-lockfile` matches `pnpm publish`'s preflight so any
        # lockfile drift fails the build instead of silently re-resolving.
        run: pnpm install --frozen-lockfile

      - name: Build site
        # No env needed: the custom domain serves from the root, so `BASE_URL`
        # stays unset (it is opt-in in `site/astro.config.mjs`) and the origin
        # is the domain itself. `site/public/CNAME` rides along in the artifact
        # and is what binds the domain on the Pages side.
        run: pnpm site:build

      - name: Upload Pages artifact
        # Bundles `site/dist` into the tarball Pages expects.
        # Automatically writes `.nojekyll` so Astro's `_astro/` asset
        # paths aren't stripped by the Jekyll preprocessor.
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
